blueprint:
  domain: script
  name: Media Player Play/Stop
  description: Use a specified music source and play on a target, if the target is already playing then stop it.
  source_url: https://github.com/na4ma4/ha-automations/blob/main/scripts/media-player.yaml
  input:
    media_player:
      name: Media Player
      description: The media player to be controlled.
      selector:
        entity:
          domain: media_player
    media_source:
      name: Media Source
      description: The media source to be played.
      selector:
        media:
    volume_level:
      name: Volume Level
      description: Volume used before starting playback.
      default: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
max_exceeded: silent
sequence:
  - variables:
      selected_media: !input media_source
  - if:
      - condition: state
        entity_id: !input media_player
        state: playing
    then:
      - action: media_player.media_stop
        target:
          entity_id: !input media_player
    else:
      - action: media_player.volume_set
        target:
          entity_id: !input media_player
        data:
          volume_level: !input volume_level
      - action: media_player.play_media
        target:
          entity_id: !input media_player
        data:
          media_content_id: >-
            {% if selected_media is mapping %}
              {{ selected_media.media_content_id }}
            {% else %}
              {{ selected_media }}
            {% endif %}
          media_content_type: >-
            {% if selected_media is mapping and selected_media.media_content_type is defined %}
              {{ selected_media.media_content_type }}
            {% else %}
              music
            {% endif %}
mode: single

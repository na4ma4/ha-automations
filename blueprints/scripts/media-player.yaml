blueprint:
  domain: script
  name: Media Player Play/Stop
  description: Use a specified music source and play on a target, if the target is already playing then stop it.
  source_url: https://github.com/na4ma4/ha-automations/blob/main/blueprints/scripts/media-player.yaml
  input:
    media_player:
      name: Media Player
      description: The media player to be controlled.
      selector:
        entity:
          domain: media_player
    media_content_id:
      name: Media Content ID
      description: Media URL or media-source ID (for example media-source://media_source/local/chime.mp3)
      selector:
        text:
    media_content_type:
      name: Media Content Type
      description: Type passed to media_player.play_media.
      default: music
      selector:
        select:
          options:
            - music
            - audio/mp3
            - playlist
            - tvshow
            - video
    volume_level:
      name: Volume Level
      description: Volume used before starting playback.
      default: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
max_exceeded: silent
sequence:
  - if:
      - condition: state
        entity_id: !input media_player
        state: playing
    then:
      - action: media_player.media_stop
        target:
          entity_id: !input media_player
    else:
      - action: media_player.volume_set
        target:
          entity_id: !input media_player
        data:
          volume_level: !input volume_level
      - action: media_player.play_media
        target:
          entity_id: !input media_player
        data:
          media_content_id: !input media_content_id
          media_content_type: !input media_content_type
mode: single

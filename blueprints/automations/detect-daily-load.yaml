blueprint:
  name: Detect daily load
  description: |
    Checks once a day whether a sensor exceeded a threshold recently, and runs
    one set of actions or the other.

    **How it works**
    - Whenever the sensor rises above the threshold, the current time is written
      to the "Threshold Last Seen Helper".
    - At the "Time to Check", if the helper was updated within the "Period"
      (counting back from the check time), the "On Threshold Actions" run.
      Otherwise the "On No Threshold Actions" run.

    **Requirements**
    - An `input_datetime` helper with both date and time enabled.

    **Notes**
    - The period is a rolling window ending at the check time, not "since
      midnight". The default of 24 hours covers the previous day.
    - The helper is only written when the sensor crosses above the threshold, so
      a load that stays above it for longer than the period will look stale.
    - The threshold is available to your actions as `{{ threshold }}`.
  domain: automation
  input:
    target_sensor:
      name: Target Sensor
      description: The sensor to monitor for daily load
      selector:
        entity:
          domain:
            - sensor
          multiple: false
          reorder: false
    threshold:
      name: Threshold
      description: The threshold value to compare against the sensor's state
      default: 0
      selector:
        number:
          min: 0.0
          step: 0.1
          mode: box
    time_to_check:
      name: Time to Check
      description: The time of day to check the sensor's value
      default: "23:59"
      selector:
        time: {}
    period:
      name: Period
      description: >-
        How far back from the check time to look for the threshold being
        exceeded. If the helper was updated within this period, the threshold
        actions run.
      default:
        hours: 24
        minutes: 0
        seconds: 0
      selector:
        duration:
          enable_day: true
          enable_second: true
    threshold_last_seen_helper:
      name: Threshold Last Seen Helper
      description: >-
        An input_datetime helper (with date and time) used to store the last
        time the threshold was exceeded.
      selector:
        entity:
          domain:
            - input_datetime
          multiple: false
          reorder: false
    on_threshold_actions:
      name: On Threshold Actions
      description: Actions to run when the threshold is exceeded
      default: []
      selector:
        action: {}
    on_no_threshold_actions:
      name: On No Threshold Actions
      description: Actions to run when the threshold is not exceeded
      default: []
      selector:
        action: {}
  source_url: https://github.com/na4ma4/ha-automations/blob/main/blueprints/automation/detect-daily-load.yaml
mode: queued
max_exceeded: silent
variables:
  target_sensor: !input target_sensor
  threshold: !input threshold
  last_seen_helper: !input threshold_last_seen_helper
  period_input: !input period
  period_seconds: >-
    {{ (period_input.days | default(0) | int) * 86400
       + (period_input.hours | default(0) | int) * 3600
       + (period_input.minutes | default(0) | int) * 60
       + (period_input.seconds | default(0) | int) }}
triggers:
  - id: daily_check
    trigger: time
    at: !input time_to_check
  - id: sensor_update
    trigger: numeric_state
    entity_id: !input target_sensor
    above: !input threshold
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: sensor_update
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input threshold_last_seen_helper
            data:
              timestamp: "{{ now().timestamp() }}"
      - conditions:
          - condition: trigger
            id: daily_check
          - condition: template
            value_template: >-
              {{ now().timestamp() - as_timestamp(states(last_seen_helper), 0)
                 < period_seconds | int }}
        sequence: !input on_threshold_actions
      - conditions:
          - condition: trigger
            id: daily_check
        sequence: !input on_no_threshold_actions

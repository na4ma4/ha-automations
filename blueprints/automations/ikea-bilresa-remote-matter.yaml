blueprint:
  name: IKEA BILRESA profile event router
  source_url: https://github.com/na4ma4/ha-automations/blob/main/blueprints/automations/ikea-bilresa-remote-matter.yaml
  description: >
    Route IKEA BILRESA event entities to actions.
    Each profile exposes separate event entities. Scroll actions are repeated
    totalNumberOfPressesCounted times. Button actions are routed by event_type:
    multi_press_1, multi_press_2, multi_press_3, long_press, long_release.
  domain: automation
  input:
    profile_1_scroll_clockwise_event:
      name: Profile 1 - clockwise scroll event
      selector:
        entity:
          domain: event

    profile_1_scroll_counterclockwise_event:
      name: Profile 1 - counter-clockwise scroll event
      selector:
        entity:
          domain: event

    profile_1_button_event:
      name: Profile 1 - button event
      selector:
        entity:
          domain: event

    profile_2_scroll_clockwise_event:
      name: Profile 2 - clockwise scroll event
      selector:
        entity:
          domain: event

    profile_2_scroll_counterclockwise_event:
      name: Profile 2 - counter-clockwise scroll event
      selector:
        entity:
          domain: event

    profile_2_button_event:
      name: Profile 2 - button event
      selector:
        entity:
          domain: event

    profile_3_scroll_clockwise_event:
      name: Profile 3 - clockwise scroll event
      selector:
        entity:
          domain: event

    profile_3_scroll_counterclockwise_event:
      name: Profile 3 - counter-clockwise scroll event
      selector:
        entity:
          domain: event

    profile_3_button_event:
      name: Profile 3 - button event
      selector:
        entity:
          domain: event

    profile_1_scroll_clockwise:
      name: Profile 1 - clockwise scroll action
      default: []
      selector:
        action:

    profile_1_scroll_counterclockwise:
      name: Profile 1 - counter-clockwise scroll action
      default: []
      selector:
        action:

    profile_1_single_press:
      name: Profile 1 - single press
      default: []
      selector:
        action:

    profile_1_double_press:
      name: Profile 1 - double press
      default: []
      selector:
        action:

    profile_1_triple_press:
      name: Profile 1 - triple press
      default: []
      selector:
        action:

    profile_1_long_press:
      name: Profile 1 - long press
      default: []
      selector:
        action:

    profile_1_long_release:
      name: Profile 1 - long release
      default: []
      selector:
        action:

    profile_2_scroll_clockwise:
      name: Profile 2 - clockwise scroll action
      default: []
      selector:
        action:

    profile_2_scroll_counterclockwise:
      name: Profile 2 - counter-clockwise scroll action
      default: []
      selector:
        action:

    profile_2_single_press:
      name: Profile 2 - single press
      default: []
      selector:
        action:

    profile_2_double_press:
      name: Profile 2 - double press
      default: []
      selector:
        action:

    profile_2_triple_press:
      name: Profile 2 - triple press
      default: []
      selector:
        action:

    profile_2_long_press:
      name: Profile 2 - long press
      default: []
      selector:
        action:

    profile_2_long_release:
      name: Profile 2 - long release
      default: []
      selector:
        action:

    profile_3_scroll_clockwise:
      name: Profile 3 - clockwise scroll action
      default: []
      selector:
        action:

    profile_3_scroll_counterclockwise:
      name: Profile 3 - counter-clockwise scroll action
      default: []
      selector:
        action:

    profile_3_single_press:
      name: Profile 3 - single press
      default: []
      selector:
        action:

    profile_3_double_press:
      name: Profile 3 - double press
      default: []
      selector:
        action:

    profile_3_triple_press:
      name: Profile 3 - triple press
      default: []
      selector:
        action:

    profile_3_long_press:
      name: Profile 3 - long press
      default: []
      selector:
        action:

    profile_3_long_release:
      name: Profile 3 - long release
      default: []
      selector:
        action:

mode: queued
max: 100

trigger:
  - platform: state
    entity_id: !input profile_1_scroll_clockwise_event
    id: profile_1_scroll_clockwise

  - platform: state
    entity_id: !input profile_1_scroll_counterclockwise_event
    id: profile_1_scroll_counterclockwise

  - platform: state
    entity_id: !input profile_1_button_event
    id: profile_1_button

  - platform: state
    entity_id: !input profile_2_scroll_clockwise_event
    id: profile_2_scroll_clockwise

  - platform: state
    entity_id: !input profile_2_scroll_counterclockwise_event
    id: profile_2_scroll_counterclockwise

  - platform: state
    entity_id: !input profile_2_button_event
    id: profile_2_button

  - platform: state
    entity_id: !input profile_3_scroll_clockwise_event
    id: profile_3_scroll_clockwise

  - platform: state
    entity_id: !input profile_3_scroll_counterclockwise_event
    id: profile_3_scroll_counterclockwise

  - platform: state
    entity_id: !input profile_3_button_event
    id: profile_3_button

variables:
  event_type: "{{ trigger.to_state.attributes.event_type | default('') }}"
  scroll_count: "{{ trigger.to_state.attributes.totalNumberOfPressesCounted | int(1) }}"
  is_scroll: "{{ '_scroll_' in trigger.id }}"
  is_button: "{{ trigger.id.endswith('_button') }}"

condition:
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable'] }}

  - condition: template
    value_template: >
      {{ event_type in [
        'multi_press_1',
        'multi_press_2',
        'multi_press_3',
        'multi_press_4',
        'multi_press_5',
        'multi_press_6',
        'multi_press_7',
        'multi_press_8',
        'long_press',
        'long_release'
      ] }}

action:
  - choose:
      ##########################################################################
      # Scroll events
      ##########################################################################

      - conditions:
          - condition: template
            value_template: "{{ is_scroll }}"
        sequence:
          - repeat:
              count: "{{ scroll_count }}"
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ trigger.id == 'profile_1_scroll_clockwise' }}"
                      sequence: !input profile_1_scroll_clockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ trigger.id == 'profile_1_scroll_counterclockwise' }}"
                      sequence: !input profile_1_scroll_counterclockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ trigger.id == 'profile_2_scroll_clockwise' }}"
                      sequence: !input profile_2_scroll_clockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ trigger.id == 'profile_2_scroll_counterclockwise' }}"
                      sequence: !input profile_2_scroll_counterclockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ trigger.id == 'profile_3_scroll_clockwise' }}"
                      sequence: !input profile_3_scroll_clockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ trigger.id == 'profile_3_scroll_counterclockwise' }}"
                      sequence: !input profile_3_scroll_counterclockwise

      ##########################################################################
      # Button events
      ##########################################################################

      - conditions:
          - condition: template
            value_template: "{{ is_button }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_1_button' and event_type == 'multi_press_1' }}"
                sequence: !input profile_1_single_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_1_button' and event_type == 'multi_press_2' }}"
                sequence: !input profile_1_double_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_1_button' and event_type == 'multi_press_3' }}"
                sequence: !input profile_1_triple_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_1_button' and event_type == 'long_press' }}"
                sequence: !input profile_1_long_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_1_button' and event_type == 'long_release' }}"
                sequence: !input profile_1_long_release

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_2_button' and event_type == 'multi_press_1' }}"
                sequence: !input profile_2_single_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_2_button' and event_type == 'multi_press_2' }}"
                sequence: !input profile_2_double_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_2_button' and event_type == 'multi_press_3' }}"
                sequence: !input profile_2_triple_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_2_button' and event_type == 'long_press' }}"
                sequence: !input profile_2_long_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_2_button' and event_type == 'long_release' }}"
                sequence: !input profile_2_long_release

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_3_button' and event_type == 'multi_press_1' }}"
                sequence: !input profile_3_single_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_3_button' and event_type == 'multi_press_2' }}"
                sequence: !input profile_3_double_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_3_button' and event_type == 'multi_press_3' }}"
                sequence: !input profile_3_triple_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_3_button' and event_type == 'long_press' }}"
                sequence: !input profile_3_long_press

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'profile_3_button' and event_type == 'long_release' }}"
                sequence: !input profile_3_long_release
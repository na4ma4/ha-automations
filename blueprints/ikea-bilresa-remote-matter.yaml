blueprint:
  name: IKEA BILRESA profile scroll and button actions
  description: >
    Run different actions for each BILRESA profile/mode.
    The physical profile button is not reported, but the current profile is
    available as previousPosition on each event. Scroll actions are repeated
    totalNumberOfPressesCounted times.

  domain: automation

  input:
    scroll_clockwise_event:
      name: Clockwise scroll event entity
      selector:
        entity:
          domain: event

    scroll_counterclockwise_event:
      name: Counter-clockwise scroll event entity
      selector:
        entity:
          domain: event

    button_event:
      name: Button press event entity
      description: Usually event.bilresa_scroll_wheel_button_3
      selector:
        entity:
          domain: event

    profile_1_clockwise:
      name: Profile 1 - clockwise scroll
      default: []
      selector:
        action:

    profile_1_counterclockwise:
      name: Profile 1 - counter-clockwise scroll
      default: []
      selector:
        action:

    profile_1_single_press:
      name: Profile 1 - single press
      default: []
      selector:
        action:

    profile_1_double_press:
      name: Profile 1 - double press
      default: []
      selector:
        action:

    profile_1_triple_press:
      name: Profile 1 - triple press
      default: []
      selector:
        action:

    profile_1_long_press:
      name: Profile 1 - long press
      default: []
      selector:
        action:

    profile_1_long_release:
      name: Profile 1 - long release
      default: []
      selector:
        action:

    profile_2_clockwise:
      name: Profile 2 - clockwise scroll
      default: []
      selector:
        action:

    profile_2_counterclockwise:
      name: Profile 2 - counter-clockwise scroll
      default: []
      selector:
        action:

    profile_2_single_press:
      name: Profile 2 - single press
      default: []
      selector:
        action:

    profile_2_double_press:
      name: Profile 2 - double press
      default: []
      selector:
        action:

    profile_2_triple_press:
      name: Profile 2 - triple press
      default: []
      selector:
        action:

    profile_2_long_press:
      name: Profile 2 - long press
      default: []
      selector:
        action:

    profile_2_long_release:
      name: Profile 2 - long release
      default: []
      selector:
        action:

    profile_3_clockwise:
      name: Profile 3 - clockwise scroll
      default: []
      selector:
        action:

    profile_3_counterclockwise:
      name: Profile 3 - counter-clockwise scroll
      default: []
      selector:
        action:

    profile_3_single_press:
      name: Profile 3 - single press
      default: []
      selector:
        action:

    profile_3_double_press:
      name: Profile 3 - double press
      default: []
      selector:
        action:

    profile_3_triple_press:
      name: Profile 3 - triple press
      default: []
      selector:
        action:

    profile_3_long_press:
      name: Profile 3 - long press
      default: []
      selector:
        action:

    profile_3_long_release:
      name: Profile 3 - long release
      default: []
      selector:
        action:

mode: queued
max: 100

trigger:
  - platform: state
    entity_id: !input scroll_clockwise_event
    id: scroll_clockwise

  - platform: state
    entity_id: !input scroll_counterclockwise_event
    id: scroll_counterclockwise

  - platform: state
    entity_id: !input button_event
    id: button

variables:
  profile: "{{ trigger.to_state.attributes.previousPosition | int(0) }}"
  event_type: "{{ trigger.to_state.attributes.event_type | default('') }}"
  press_count: "{{ trigger.to_state.attributes.totalNumberOfPressesCounted | int(1) }}"
  is_scroll: "{{ trigger.id in ['scroll_clockwise', 'scroll_counterclockwise'] }}"
  is_button: "{{ trigger.id == 'button' }}"

  scroll_repeat_count: >-
    {% if is_scroll and event_type.startswith('multi_press_') %}
      {{ press_count }}
    {% else %}
      1
    {% endif %}

condition:
  - condition: template
    value_template: >
      {{ profile in [1, 2, 3]
         and event_type in [
           'multi_press_1',
           'multi_press_2',
           'multi_press_3',
           'multi_press_4',
           'multi_press_5',
           'multi_press_6',
           'multi_press_7',
           'multi_press_8',
           'long_press',
           'long_release'
         ] }}

action:
  - choose:
      ##########################################################################
      # Scroll events
      ##########################################################################

      - conditions:
          - condition: template
            value_template: "{{ is_scroll }}"
        sequence:
          - repeat:
              count: "{{ scroll_repeat_count }}"
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ profile == 1 and trigger.id == 'scroll_clockwise' }}"
                      sequence: !input profile_1_clockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ profile == 1 and trigger.id == 'scroll_counterclockwise' }}"
                      sequence: !input profile_1_counterclockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ profile == 2 and trigger.id == 'scroll_clockwise' }}"
                      sequence: !input profile_2_clockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ profile == 2 and trigger.id == 'scroll_counterclockwise' }}"
                      sequence: !input profile_2_counterclockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ profile == 3 and trigger.id == 'scroll_clockwise' }}"
                      sequence: !input profile_3_clockwise

                    - conditions:
                        - condition: template
                          value_template: "{{ profile == 3 and trigger.id == 'scroll_counterclockwise' }}"
                      sequence: !input profile_3_counterclockwise

      ##########################################################################
      # Button events
      ##########################################################################

      - conditions:
          - condition: template
            value_template: "{{ is_button }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ profile == 1 and event_type == 'multi_press_1' }}"
                sequence: !input profile_1_single_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 1 and event_type == 'multi_press_2' }}"
                sequence: !input profile_1_double_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 1 and event_type == 'multi_press_3' }}"
                sequence: !input profile_1_triple_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 1 and event_type == 'long_press' }}"
                sequence: !input profile_1_long_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 1 and event_type == 'long_release' }}"
                sequence: !input profile_1_long_release

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 2 and event_type == 'multi_press_1' }}"
                sequence: !input profile_2_single_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 2 and event_type == 'multi_press_2' }}"
                sequence: !input profile_2_double_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 2 and event_type == 'multi_press_3' }}"
                sequence: !input profile_2_triple_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 2 and event_type == 'long_press' }}"
                sequence: !input profile_2_long_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 2 and event_type == 'long_release' }}"
                sequence: !input profile_2_long_release

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 3 and event_type == 'multi_press_1' }}"
                sequence: !input profile_3_single_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 3 and event_type == 'multi_press_2' }}"
                sequence: !input profile_3_double_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 3 and event_type == 'multi_press_3' }}"
                sequence: !input profile_3_triple_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 3 and event_type == 'long_press' }}"
                sequence: !input profile_3_long_press

              - conditions:
                  - condition: template
                    value_template: "{{ profile == 3 and event_type == 'long_release' }}"
                sequence: !input profile_3_long_release